<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Jason's Kicks</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- My CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="bg-dark text-white text-center p-4">
        <h1>Jason's Kicks</h1>
        <p>Your place for the latest sneakers!</p>
    </header>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                Jason's Kicks
            </a>

            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link active" href="signup.html">Sign Up</a>
            </div>

        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <h2 class="text-center mb-4">User Signup</h2>

                <form id="signupForm">

                    <!-- Username -->
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            Username:
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            placeholder="Enter username">
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email:
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="email"
                            placeholder="Enter email">
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password:
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Enter password">
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">
                            Confirm Password:
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            placeholder="Confirm password">
                    </div>

                    <!-- Sign Up Button -->
                    <button
                        type="submit"
                        class="btn btn-primary w-100">
                        Sign Up
                    </button>

                    <!-- Validation Message -->
                    <p
                        id="message"
                        class="text-center mt-3">
                    </p>

                </form>

            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">
            &copy; 2026 Jason's Kicks. All rights reserved.
        </p>
    </footer>

    <!-- JavaScript -->
    <script>

        // Get the signup form
        document.getElementById("signupForm").addEventListener("submit", function(event) {

            // Stop the form from submitting
            event.preventDefault();

            // Get each field
            const username = document.getElementById("username");
            const email = document.getElementById("email");
            const password = document.getElementById("password");
            const confirmPassword = document.getElementById("confirmPassword");
            const message = document.getElementById("message");

            // Keep track of whether the form is valid
            let formIsValid = true;

            // Reset message
            message.textContent = "";

            // Reset all error styles
            username.classList.remove("error");
            email.classList.remove("error");
            password.classList.remove("error");
            confirmPassword.classList.remove("error");


            // -------------------------
            // Check Username
            // -------------------------

            if (
                username.value.trim() === "" ||
                username.value === "Field is required"
            ) {

                username.value = "Field is required";
                username.classList.add("error");

                formIsValid = false;
            }


            // -------------------------
            // Check Email
            // -------------------------

            if (
                email.value.trim() === "" ||
                email.value === "Field is required"
            ) {

                email.value = "Field is required";
                email.classList.add("error");

                formIsValid = false;
            }

            // Check email format
            else if (
                !email.value.includes("@") ||
                !email.value.includes(".") ||
                email.value === "Enter a valid email"
            ) {

                email.value = "Enter a valid email";
                email.classList.add("error");

                formIsValid = false;
            }


            // -------------------------
            // Check Password
            // -------------------------

            if (
                password.value.trim() === "" ||
                password.value === "Field is required"
            ) {

                // Change to text so the error can be seen
                password.type = "text";

                password.value = "Field is required";
                password.classList.add("error");

                formIsValid = false;
            }


            // -------------------------
            // Check Confirm Password
            // -------------------------

            if (
                confirmPassword.value.trim() === "" ||
                confirmPassword.value === "Field is required"
            ) {

                // Change to text so the error can be seen
                confirmPassword.type = "text";

                confirmPassword.value = "Field is required";
                confirmPassword.classList.add("error");

                formIsValid = false;
            }


            // -------------------------
            // Check if Passwords Match
            // -------------------------

            if (
                password.value !== "Field is required" &&
                confirmPassword.value !== "Field is required" &&
                password.value !== confirmPassword.value
            ) {

                password.classList.add("error");
                confirmPassword.classList.add("error");

                message.textContent = "Passwords do not match!";
                message.style.color = "red";

                formIsValid = false;
            }


            // -------------------------
            // Everything is Correct
            // -------------------------

            if (formIsValid === true) {

                message.textContent = "Form validated successfully!";
                message.style.color = "green";
            }

        });


        // ------------------------------------
        // Reset error when user clicks a field
        // ------------------------------------

        document.querySelectorAll(".form-control").forEach(function(field) {

            field.addEventListener("focus", function() {

                // Remove error text
                if (
                    field.value === "Field is required" ||
                    field.value === "Enter a valid email"
                ) {

                    field.value = "";
                }

                // Remove red text and red border
                field.classList.remove("error");

                // Change password fields back to password type
                if (
                    field.id === "password" ||
                    field.id === "confirmPassword"
                ) {

                    field.type = "password";
                }

                // Clear message underneath the form
                document.getElementById("message").textContent = "";

            });

        });

    </script>

</body>

</html>
