<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jason's Kicks - Sign Up</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- My CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Jason's Kicks</h1>
        <p>Your destination for the latest sneakers</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="signup.html">Sign Up</a>
    </nav>

    <main class="container my-5">

        <div class="row justify-content-center">
            <div class="col-md-6">

                <h2 class="mb-4">User Signup</h2>

                <form id="signupForm">

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email:
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="email"
                            placeholder="Enter email">
                    </div>

                    <!-- Username -->
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            Username:
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            placeholder="Enter username">
                    </div>

                    <!-- Confirm Username -->
                    <div class="mb-3">
                        <label for="confirmUsername" class="form-label">
                            Confirm Username:
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="confirmUsername"
                            placeholder="Confirm username">
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password:
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Enter password">
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">
                            Confirm Password:
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            placeholder="Confirm password">
                    </div>

                    <!-- Validation Message -->
                    <p id="message"></p>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-dark">
                        Sign Up
                    </button>

                </form>

                <!-- JSON Output -->
                <div class="mt-4">
                    <h3>User JSON Document</h3>
                    <pre id="jsonOutput"></pre>
                </div>

            </div>
        </div>

    </main>


    <script>

        // Get the signup form
        document.getElementById("signupForm").addEventListener("submit", function(event) {

            // Stop the page from submitting
            event.preventDefault();

            // Get each input field
            const email = document.getElementById("email");
            const username = document.getElementById("username");
            const confirmUsername = document.getElementById("confirmUsername");
            const password = document.getElementById("password");
            const confirmPassword = document.getElementById("confirmPassword");

            const message = document.getElementById("message");
            const jsonOutput = document.getElementById("jsonOutput");

            // Keep track of whether the form is valid
            let isValid = true;

            // Reset all colors and borders before checking
            email.style.color = "";
            username.style.color = "";
            confirmUsername.style.color = "";
            password.style.color = "";
            confirmPassword.style.color = "";

            email.style.borderColor = "";
            username.style.borderColor = "";
            confirmUsername.style.borderColor = "";
            password.style.borderColor = "";
            confirmPassword.style.borderColor = "";

            message.textContent = "";
            jsonOutput.textContent = "";


            // Check email
            if (email.value.trim() === "") {

                email.value = "Field is required";
                email.style.color = "red";
                email.style.borderColor = "red";

                isValid = false;
            }

            // Check email format
            else if (
                !email.value.includes("@") ||
                !email.value.includes(".")
            ) {

                email.value = "Enter a valid email";
                email.style.color = "red";
                email.style.borderColor = "red";

                isValid = false;
            }


            // Check username
            if (username.value.trim() === "") {

                username.value = "Field is required";
                username.style.color = "red";
                username.style.borderColor = "red";

                isValid = false;
            }


            // Check confirm username
            if (confirmUsername.value.trim() === "") {

                confirmUsername.value = "Field is required";
                confirmUsername.style.color = "red";
                confirmUsername.style.borderColor = "red";

                isValid = false;
            }


            // Check if usernames match
            if (
                username.value !== "Field is required" &&
                confirmUsername.value !== "Field is required" &&
                username.value !== confirmUsername.value
            ) {

                username.style.borderColor = "red";
                confirmUsername.style.borderColor = "red";

                message.textContent = "Usernames do not match!";
                message.style.color = "red";

                isValid = false;
            }


            // Check password
            if (password.value.trim() === "") {

                // Change to text so the error can be seen
                password.type = "text";

                password.value = "Field is required";
                password.style.color = "red";
                password.style.borderColor = "red";

                isValid = false;
            }


            // Check confirm password
            if (confirmPassword.value.trim() === "") {

                // Change to text so the error can be seen
                confirmPassword.type = "text";

                confirmPassword.value = "Field is required";
                confirmPassword.style.color = "red";
                confirmPassword.style.borderColor = "red";

                isValid = false;
            }


            // Check if passwords match
            if (
                password.value !== "Field is required" &&
                confirmPassword.value !== "Field is required" &&
                password.value !== confirmPassword.value
            ) {

                password.style.borderColor = "red";
                confirmPassword.style.borderColor = "red";

                message.textContent = "Passwords do not match!";
                message.style.color = "red";

                isValid = false;
            }


            // If everything is correct
            if (isValid) {

                // Display success message
                message.textContent = "Form validated successfully!";
                message.style.color = "green";

                // Make all input borders green
                email.style.borderColor = "green";
                username.style.borderColor = "green";
                confirmUsername.style.borderColor = "green";
                password.style.borderColor = "green";
                confirmPassword.style.borderColor = "green";


                // Create shopper object using form values
                const shopper = {

                    email: email.value,
                    username: username.value,
                    confirmUsername: confirmUsername.value,
                    password: password.value,
                    confirmPassword: confirmPassword.value

                };


                // Convert the shopper object into JSON
                const shopperJSON = JSON.stringify(shopper, null, 4);


                // Display JSON document on the page
                jsonOutput.textContent = shopperJSON;

            }

        });


        // Reset errors when the user clicks back into a field
        document.querySelectorAll(".form-control").forEach(function(field) {

            field.addEventListener("focus", function() {

                // Remove error message from inside the field
                if (
                    field.value === "Field is required" ||
                    field.value === "Enter a valid email"
                ) {

                    field.value = "";

                }

                // Reset text color
                field.style.color = "";

                // Reset border color
                field.style.borderColor = "";

                // Change password fields back to password type
                if (
                    field.id === "password" ||
                    field.id === "confirmPassword"
                ) {

                    field.type = "password";

                }

                // Clear validation message
                document.getElementById("message").textContent = "";

            });

        });

    </script>

</body>

</html>
