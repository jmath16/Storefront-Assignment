<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Jason's Kicks</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- My CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="bg-dark text-white text-center p-4">
        <h1>Jason's Kicks</h1>
        <p>Your place for the latest sneakers!</p>
    </header>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
        <div class="container">
            <a class="navbar-brand" href="index.html">Jason's Kicks</a>

            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link active" href="signup.html">Sign Up</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <h2 class="text-center mb-4">User Signup</h2>

                <form id="signupForm">

                    <!-- Username -->
                    <div class="mb-3">
                        <label for="username" class="form-label">Username:</label>
                        <input type="text" class="form-control" id="username" placeholder="Enter username">
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Email:</label>
                        <input type="text" class="form-control" id="email" placeholder="Enter email">
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Password:</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter password">
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm Password:</label>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm password">
                    </div>

                    <!-- Sign Up Button -->
                    <button type="submit" class="btn btn-primary w-100">Sign Up</button>

                    <!-- Validation Message -->
                    <p id="message" class="text-center mt-3"></p>

                </form>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">&copy; 2026 Jason's Kicks. All rights reserved.</p>
    </footer>

    <!-- JavaScript -->
    <script>

        // Get the signup form
        document.getElementById("signupForm").addEventListener("submit", function(event) {

            // Stop the form from submitting
            event.preventDefault();

            // Get each field
            const username = document.getElementById("username");
            const email = document.getElementById("email");
            const password = document.getElementById("password");
            const confirmPassword = document.getElementById("confirmPassword");
            const message = document.getElementById("message");

            // Reset colors and borders
            username.style.color = "";
            email.style.color = "";
            password.style.color = "";
            confirmPassword.style.color = "";

            username.style.border = "";
            email.style.border = "";
            password.style.border = "";
            confirmPassword.style.border = "";

            message.textContent = "";

            // Check username
            if (username.value.trim() === "") {
                username.value = "Field is required";
                username.style.color = "red";
                username.style.border = "2px solid red";
                return;
            }

            // Check email
            if (email.value.trim() === "") {
                email.value = "Field is required";
                email.style.color = "red";
                email.style.border = "2px solid red";
                return;
            }

            // Check email format
            if (!email.value.includes("@") || !email.value.includes(".")) {
                email.value = "Enter a valid email";
                email.style.color = "red";
                email.style.border = "2px solid red";
                return;
            }

            // Check password
            if (password.value.trim() === "") {
                password.type = "text";
                password.value = "Field is required";
                password.style.color = "red";
                password.style.border = "2px solid red";
                return;
            }

            // Check confirm password
            if (confirmPassword.value.trim() === "") {
                confirmPassword.type = "text";
                confirmPassword.value = "Field is required";
                confirmPassword.style.color = "red";
                confirmPassword.style.border = "2px solid red";
                return;
            }

            // Check if passwords match
            if (password.value !== confirmPassword.value) {
                password.style.border = "2px solid red";
                confirmPassword.style.border = "2px solid red";

                message.textContent = "Passwords do not match!";
                message.style.color = "red";
                return;
            }

            // Everything is correct
            message.textContent = "Form validated successfully!";
            message.style.color = "green";
        });


        // Reset red text and border when the user goes back to fix a field
        document.querySelectorAll(".form-control").forEach(function(field) {

            field.addEventListener("focus", function() {

                // Remove error message from the textbox
                if (field.value === "Field is required" ||
                    field.value === "Enter a valid email") {
                    field.value = "";
                }

                // Reset text color
                field.style.color = "";

                // Reset border
                field.style.border = "";

                // Change password fields back to password type
                if (field.id === "password" ||
                    field.id === "confirmPassword") {
                    field.type = "password";
                }

                // Clear the message underneath the form
                document.getElementById("message").textContent = "";
            });
        });

    </script>

</body>
</html>
