
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>

    <!-- Bootstrap: Group Member Name -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery: Group Member Name -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- CSS: Group Member Name -->
    <link rel="stylesheet" href="style.css">

    <!-- JavaScript: Group Member Name -->
    <script src="product.js" defer></script>
</head>

<body>
    <!-- HTML Structure: Group Member Name -->
    <div class="container mt-4 mb-5">

        <nav class="mb-4">
            <a href="index.html" class="btn btn-outline-primary">
                Back to Storefront
            </a>
        </nav>

        <h1>Product Management</h1>

        <!-- Product Form: Group Member Name -->
        <form id="productForm">

            <div class="mb-3">
                <label for="productId" class="form-label">
                    Product ID:
                </label>
                <input type="text" id="productId"
                       class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="productDesc" class="form-label">
                    Product Description:
                </label>
                <input type="text" id="productDesc"
                       class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="productCategory" class="form-label">
                    Product Category:
                </label>
                <select id="productCategory"
                        class="form-select" required>
                    <option value="">Select Category</option>
                    <option value="Men's Clothing">Men's Clothing</option>
                    <option value="Women's Clothing">Women's Clothing</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Shoes">Shoes</option>
                    <option value="Accessories">Accessories</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="productUOM" class="form-label">
                    Product Unit of Measure:
                </label>
                <select id="productUOM"
                        class="form-select" required>
                    <option value="">Select Unit</option>
                    <option value="Piece">Piece</option>
                    <option value="Box">Box</option>
                    <option value="Pound">Pound</option>
                    <option value="Pair">Pair</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="productPrice" class="form-label">
                    Product Price:
                </label>
                <input type="number" id="productPrice"
                       class="form-control"
                       min="0" step="0.01" required>
            </div>

            <div class="mb-3">
                <label for="productWeight" class="form-label">
                    Product Weight:
                </label>
                <input type="number" id="productWeight"
                       class="form-control"
                       min="0" step="any">
            </div>

            <button type="submit"
                    class="btn btn-success w-100">
                Save
            </button>
        </form>

        <!-- Search Section: Group Member Name -->
        <h2 class="mt-4">Search Product</h2>

        <div class="mb-3">
            <label for="searchId" class="form-label">
                Product ID:
            </label>
            <input type="text" id="searchId"
                   class="form-control">
        </div>

        <button type="button" id="searchBtn"
                class="btn btn-primary">
            Search
        </button>

        <!-- JSON Display: Group Member Name -->
        <h2 class="mt-4">Product Details</h2>
        <h3>JSON</h3>

        <pre id="jsonOutput"></pre>

        <!-- Update Section: Group Member Name -->
        <button type="button" id="updateBtn"
                class="btn btn-success w-100 mt-3">
            Update
        </button>

        <p id="message" class="mt-3" role="status"
           aria-live="polite"></p>

    </div>
</body>
</html>
