
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <link rel="stylesheet" href="style.css">
    <script src="product.js" defer></script>
</head>
<body>
    <main class="container mt-4">
        <h1>Product Management</h1>

        <!-- HTML Developer: Replace with group member name -->
        <form id="productForm">
            <label for="productId">Product ID:</label>
            <input type="text" id="productId" class="form-control" required>

            <label for="productDesc">Product Description:</label>
            <input type="text" id="productDesc" class="form-control" required>

            <label for="productCategory">Product Category:</label>
            <select id="productCategory" class="form-select" required>
                <option value="">Select Category</option>
                <option>Men's Clothing</option>
                <option>Women's Clothing</option>
                <option>Electronics</option>
                <option>Accessories</option>
            </select>

            <label for="productUOM">Product Unit of Measure:</label>
            <select id="productUOM" class="form-select" required>
                <option value="">Select Unit</option>
                <option>Piece</option>
                <option>Box</option>
                <option>Pound</option>
            </select>

            <label for="productPrice">Product Price:</label>
            <input type="number" id="productPrice" class="form-control" min="0" step="0.01" required>

            <label for="productWeight">Product Weight:</label>
            <input type="number" id="productWeight" class="form-control" min="0" step="any">

            <button type="submit" class="btn btn-success mt-3 w-100">Save</button>
        </form>

        <h2 class="mt-4">Search Product</h2>
        <label for="searchId">Product ID:</label>
        <input type="text" id="searchId" class="form-control">
        <button type="button" id="searchBtn" class="btn btn-primary mt-2">Search</button>

        <h2 class="mt-4">Product Details</h2>
        <h3>JSON</h3>
        <pre id="jsonOutput"></pre>

        <button type="button" id="updateBtn" class="btn btn-success w-100">Update</button>
    </main>
</body>
</html>
